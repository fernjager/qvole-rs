# CI: format, clippy, unit tests, and a release build on Linux/amd64,
# Linux/arm64, and macOS (Apple Silicon). The port targets Linux and also
# builds on macOS; see the README.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep CI fast: the default 600k PBKDF2 rounds make the SPAKE2 tests take
  # several minutes in a debug build. This is the enforced minimum, and no test
  # depends on the default value.
  QVOLE_KDF_ITERATIONS: "100000"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          # GitHub-hosted arm64 Linux runner (Raspberry Pi 4/5 class, 64-bit).
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --workspace --release
