[package]
name = "qvole-spake2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SPAKE2 key agreement and shared-code handling (port of qvole spake2 package and internal/util/code.go)"

[features]
test-util = []

[dependencies]
# rand_core 0.6 supplies the stateless `OsRng` used for ephemeral bytes. The
# p256 0.14 tree has its own rand_core 0.10 internally, but this crate never
# passes a caller-supplied RNG into p256, so the two versions do not mix.
rand_core = { version = "0.6", features = ["std"] }
p256 = { version = "0.14", features = ["arithmetic"] }
sha2 = "0.11"
# primeorder is already in the tree via p256; referenced directly for the
# P-256 `EQUATION_B` curve constant (cross-checked against p256's own value).
primeorder = "0.14"
hmac = "0.13"
hkdf = "0.13"
pbkdf2 = "0.13"
aes-gcm = "0.11"
zeroize = "1"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
